<header class="header">
      <div class="header-left">
        <button class="menu-btn" (click)="toggleSidebar.emit()" aria-label="Toggle menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <h1 class="logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 11l3 3L22 4"></path>
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"></path>
          </svg>
          <span>SmartTask Optimizer</span>
        </h1>
      </div>
      
      <div class="header-right">
        <div class="search-box">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
          <input type="text" placeholder="Search tasks..." />
        </div>
        
        <button class="icon-btn" aria-label="Notifications" (click)="markNotificationsRead()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
            <path d="M13.73 21a2 2 0 01-3.46 0"></path>
          </svg>
          <span class="badge" *ngIf="unreadCount">{{ unreadCount }}</span>
        </button>
        
        <div class="user-menu" *ngIf="session$ | async as session">
          <img [src]="'https://ui-avatars.com/api/?name=' + session.fullName" alt="User avatar" />
          <span class="user-name">{{ session.fullName }}</span>
          <button type="button" class="icon-btn" (click)="logout()" aria-label="Sign out">Sign out</button>
        </div>
      </div>
    </header>
