<div class="confirm-backdrop" *ngIf="state$ | async as state" (click)="respond(false)">
  <div class="confirm-dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="state.title" (click)="$event.stopPropagation()">
    <h3>{{ state.title }}</h3>
    <p>{{ state.message }}</p>
    <div class="confirm-actions">
      <button type="button" class="btn-secondary" (click)="respond(false)">{{ state.cancelLabel || 'Cancel' }}</button>
      <button type="button" [class]="state.danger ? 'btn-danger' : 'btn-primary'" (click)="respond(true)">
        {{ state.confirmLabel || 'Confirm' }}
      </button>
    </div>
  </div>
</div>
